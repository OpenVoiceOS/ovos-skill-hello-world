[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-hello-world"
dynamic = ["version"]
description = "OVOS hello world skill plugin"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" }
]
keywords = ["ovos", "skill", "plugin"]
requires-python = ">=3.9"
dependencies = [
    "ovos-utils>=0.15.0a1",
    "ovos-workshop>=9.8.0a1",
    "ovos-plugin-manager>=2.12.1a1",
]

[project.optional-dependencies]
# unit tests and coverage (test/unittests): no system deps
test = [
    "pytest>=5.2.4",
    "pytest-cov>=2.8.1",
    "coveralls>=1.8.2",
    "cov-core>=1.15.0",
]
# end-to-end suite (test/end2end): ovoscope, ovos-core plugins and the
# intent pipelines; needs swig and libfann-dev to build padatious' fann2
end2end = [
    "pytest>=5.2.4",
    "ovoscope>=1.8.5a1",
    "ovos-core[plugins]>=2.0.0a1",
    "ovos-bus-client",
    "ovos-adapt-parser>=1.0.9",
    "ovos-padatious>=2.0.1a1",
    "ovos-m2v-pipeline>=0.5.4a1",
    "nebulento>=0.1.0",
    "palavreado>=0.2.0",
    "ovos-spec-tools",
]
lint = [
    "flake8>=3.7.9",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-skill-hello-world"

[project.entry-points."opm.skill"]
"ovos-skill-hello-world.openvoiceos" = "ovos_skill_hello_world:HelloWorldSkill"

[tool.setuptools.dynamic]
version = { attr = "ovos_skill_hello_world.version.__version__" }

[tool.setuptools]
packages = ["ovos_skill_hello_world"]
include-package-data = true

[tool.setuptools.package-data]
ovos_skill_hello_world = ["*.json", "locale/**/*"]
