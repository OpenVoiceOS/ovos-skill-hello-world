name: Lint

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  lint:
    uses: OpenVoiceOS/gh-automations/.github/workflows/lint.yml@fix/lint-section-key
    secrets: inherit
    with:
      ruff: true
      pre_commit: false   # set true if .pre-commit-config.yaml exists

  # T-2338 canary: ruff_args that matches no Python file must read as
  # "checked no file", not as clean.
  lint_nothing:
    uses: OpenVoiceOS/gh-automations/.github/workflows/lint.yml@fix/lint-section-key
    secrets: inherit
    with:
      ruff: true
      ruff_args: "locale"
      pre_commit: false
      section_key: nothing
