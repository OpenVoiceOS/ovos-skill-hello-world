name: Release Alpha and Propose Stable

# T-2782 canary, not for merge: publish-alpha against a scratch branch with
# no tag, no release proposal, no PyPI upload and no Matrix message.

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish_alpha:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-alpha.yml@dev
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
    with:
      branch: 'ci/canary-publish-alpha-race-target'
      version_file: 'ovos_skill_hello_world/version.py'
      update_changelog: true
      publish_prerelease: false
      propose_release: false
      changelog_max_issues: 50
      publish_pypi: false
      notify_matrix: false
