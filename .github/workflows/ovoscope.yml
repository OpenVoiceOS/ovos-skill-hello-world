name: Skill End-to-End Tests (ovoscope)

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      install_extras: 'test'
      test_path: 'test/end2end/'
      # Install ovoscope + pipeline plugins from their `dev` branches so the
      # intent-case helper is available before it lands on PyPI. Drop once
      # an ovoscope release ships.
      pre_release: true
      require_padatious: true
      require_m2v: true
      # Shard by language — one matrix job per locale so each runs a few
      # hundred tests instead of 1,200 in series. Must match the locale
      # folders shipped under ovos_skill_hello_world/locale/.
      langs: '["ca-ES","cs-CZ","da-DK","de-DE","el-GR","en-US","es-ES","eu-ES","fa-IR","fr-FR","gl-ES","hu-HU","it-IT","nl-NL","pl-PL","pt-BR","pt-PT","ro-RO","ru-RU","sv-SE","tr-TR"]'
