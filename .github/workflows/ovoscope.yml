name: Skill End-to-End Tests (ovoscope)

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      install_extras: 'test'
      test_path: 'test/end2end/test_helloworld.py'
      # Install ovoscope + pipeline plugins from their `dev` branches so the
      # intent-case helper is available before it lands on PyPI. Drop once
      # an ovoscope release ships.
      pre_release: true
      require_padatious: true
      require_m2v: true
      # Run hand-written end-to-end tests only — intent-case routing
      # accuracy is gated by the sibling intent-case-tests.yml workflow.
      # The auto-discovery shim under test/end2end/test_intents.py also
      # gets collected here, which is fine: the canon source of the
      # accuracy gate is the dedicated workflow.
